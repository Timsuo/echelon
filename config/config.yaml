groups:
  allowed: [756155087,677042790,985541102]  # 填写数字群号，例如 [123456789]
timezone: Asia/Shanghai
websocket:
  host: 127.0.0.1
  port: 8789
  action_timeout: 15
deepseek:
  model: deepseek-flash
  thinking: false
  timeout: 60
  retries: 2  # API 与模型输出共用的重试预算，不含初次请求
  max_messages: 1000
  max_input_chars: 60000
logging:
  level: INFO
attachments:
  enabled: true
  storage_dir: data/attachments
  auto_download: true
  max_auto_download_mb: 100
  retry_count: 2
inbox:
  default_page_size: 10
history:
  enabled: true
  reconnect_count: 200
  periodic_enabled: true
  inbox_interval_seconds: 300
  priority_interval_seconds: 120
  summary_only_interval_seconds: 1800
  periodic_count: 100
  retry_count: 2
  overlap_seconds: 300
  debounce_seconds: 60
  request_interval_seconds: 2
triage:
  enabled: true
  inbox_debounce_seconds: 180
  priority_debounce_seconds: 60
  inbox_max_wait_seconds: 600
  priority_max_wait_seconds: 180
  max_messages_per_candidate: 100
  max_input_chars: 40000
  max_span_seconds: 3600
  retry_count: 2
